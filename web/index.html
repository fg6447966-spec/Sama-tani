async function onClick(e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  const id = el.getAttribute('data-id');
  const val = el.getAttribute('data-val');
  if (el.tagName === 'BUTTON' && el.type === 'submit' && el.form) return;
  if (el.tagName === 'A' && !(act === 'orders-tab')) e.preventDefault();
  const m = me();
  switch (act) {
    case 'close-sheet': closeSheet(); break;
    case 'close-dialog': closeDialog(); break;
    case 'set': setPath(el.getAttribute('data-path'), val); render(); break;
    case 'toggle-draft': { const p = el.getAttribute('data-path'); setPath(p, bindVal(p) === false); render(); break; }
    case 'auth-tab': ui.authTab = val; ui.errors = {}; render(); break;
    case 'skip-loading': if (app.mode === 'loading') startLocal(''); break;
    case 'demo': if (app.mode !== 'local') break; app.backend.setMe(val === 'petani' ? 'demo-petani' : 'demo-pembeli'); ui.tab = homeTab(val); location.hash = ui.tab; toast(val === 'petani' ? 'Masuk sebagai Demo Petani' : 'Masuk sebagai Demo Pembeli', 'good'); break;
    case 'logout': confirmDialog('Keluar dari akun?', 'Data tetap tersimpan di browser ini. Masuk lagi dengan nomor HP yang sama.', 'Keluar', true, () => { app.backend.setMe(null); ui.notifs = []; ui.unread = 0; watchPrev = null; location.hash = ''; }); break;
    case 'ask-reset': confirmDialog('Reset data demo?', 'Semua akun, produk, dan pesanan di browser ini dihapus lalu diganti data contoh.', 'Reset', true, () => { app.backend.reset(); ui.notifs = []; ui.unread = 0; watchPrev = null; location.hash = ''; toast('Data demo dikembalikan ke awal', 'good'); }); break;
    case 'market-cat': ui.market.cat = val || ''; render(); break;
    case 'req-cat': ui.reqCat = val || ''; render(); break;
    case 'orders-tab': ui.ordersTab = val === 'nego' ? 'nego' : 'pesanan'; if (el.tagName !== 'A') render(); break;
    case 'orders-history': ui.ordersHistory = val === '1'; render(); break;
    case 'goto-nego': ui.ordersTab = 'nego'; goTab('pesanan'); break;
    case 'open-product': ui.dialog = null; openSheet('product', id); break;
    case 'open-order': ui.dialog = null; openSheet('order', id); break;
    case 'open-request': openSheet('request', id); break;
    case 'open-notifs': ui.unread = 0; ui.notifs.forEach(n => { n.read = true; }); openSheet('notifs'); break;
    case 'clear-notifs': ui.notifs = []; ui.unread = 0; render(); break;
    case 'notif-go': {
      const n = ui.notifs.find(x => String(x.id) === id);
      ui.sheet = null;
      if (n && n.link) {
        if (n.link.sheet) { openSheet(n.link.sheet, n.link.id); return; }
        if (n.link.ordersTab) ui.ordersTab = n.link.ordersTab;
        if (n.link.tab) { goTab(n.link.tab); return; }
      }
      render();
      break;
    }
    case 'new-product':
      if (!m) return;
      ui.drafts.prod = { id: null, name: '', category: 'sayuran', unit: 'kg', price: '', stock: '', minOrder: '1', grade: 'A', harvest: '', location: m.location, description: '', photo: '', active: true };
      ui.errors.prod = null; openSheet('product-form'); break;
    case 'edit-product': {
      const p = prod(id); if (!p) return;
      ui.drafts.prod = { id: p.id, name: p.name, category: catKey(p.category), unit: p.unit, price: String(num(p.price)), stock: String(num(p.stock)), minOrder: String(num(p.minOrder, 1)), grade: p.grade, harvest: p.harvestInfo || '', location: p.location, description: p.description || '', photo: safeImg(p.photo), active: p.active !== false };
      ui.errors.prod = null; ui.dialog = null; openSheet('product-form'); break;
    }
    case 'clear-photo': if (ui.drafts.prod) { ui.drafts.prod.photo = ''; render(); } break;
    case 'toggle-product': { const p = prod(id); if (!p) return; await W.patch('products', p.id, { active: p.active === false, updatedAt: now() }); toast(p.active === false ? 'Produk tampil lagi di pasar' : 'Produk disembunyikan dari pasar', 'info'); break; }
    case 'ask-delete-product': { const p = prod(id); if (!p) return; confirmDialog('Hapus produk?', '"' + p.name + '" akan dihapus dari daftar jual Anda. Pesanan yang sudah ada tidak terpengaruh.', 'Hapus', true, () => deleteProduct(p.id)); break; }
    case 'pq-dec': case 'pq-inc': case 'cart-dec': case 'cart-inc': {
      const p = prod(id); if (!p) return;
      const step = num(el.getAttribute('data-step'), 1);
      const minQ = minQtyOf(p); const maxQ = Math.max(num(p.stock), minQ);
      const isCart = act.startsWith('cart');
      const cur = isCart ? num((st().cart.find(x => x.productId === id) || {}).quantity, minQ) : num((ui.drafts.qty || {})[id], minQ);
      const next = Math.max(minQ, Math.min(maxQ, cur + (act.endsWith('inc') ? step : -step)));
      if (isCart) await setCartQty(id, next); else { (ui.drafts.qty || (ui.drafts.qty = {}))[id] = next; render(); }
      break;
    }
    case 'cart-remove': await setCartQty(id, 0); toast('Dihapus dari keranjang', 'info'); break;
    case 'add-cart': {
      const p = prod(id); if (!p) return;
      const q = Math.max(minQtyOf(p), Math.min(num((ui.drafts.qty || {})[id], minQtyOf(p)), num(p.stock)));
      await addToCart(id, q); break;
    }
    case 'offer': {
      const p = prod(id); if (!p) return;
      const q = Math.max(minQtyOf(p), Math.min(num((ui.drafts.qty || {})[id], minQtyOf(p)), num(p.stock)));
      ui.drafts.offer = { pid: p.id, quantity: String(q), price: String(roundPrice(num(p.price) * 0.9)), note: '' };
      ui.errors.offer = null; ui.dialog = { type: 'offer', id: p.id }; render(); break;
    }
    case 'checkout':
      if (!m) return;
      ui.drafts.checkout = ui.drafts.checkout || { address: m.location, shipping: SHIPPING[0], payment: PAYMENT[0], note: '' };
      ui.errors.checkout = null; openSheet('checkout'); break;
    case 'order-act': {
      const a = ORDER_ACTS[val]; if (!a) return;
      confirmDialog(a[0], a[1], a[2], val === 'reject' || val === 'cancel', async () => { if (await orderMove(id, a[3], a[4])) toast(a[5], val === 'reject' || val === 'cancel' ? 'info' : 'good'); });
      break;
    }
    case 'offer-accept': { const f = byId('offers', id); if (!f) return; confirmDialog('Terima harga ini?', 'Pesanan dibuat otomatis dengan harga ' + rp(f.status === 'menunggu' ? f.offeredPrice : f.counterPrice) + '/' + f.unit + '.', 'Terima', false, async () => { if (await acceptOffer(id)) toast('Harga disepakati. Pesanan dibuat.', 'good'); }); break; }
    case 'offer-reject': confirmDialog('Tolak tawaran?', 'Tawaran ini akan ditandai ditolak.', 'Tolak', true, async () => { if (await rejectOffer(id)) toast('Tawaran ditolak', 'info'); }); break;
    case 'offer-counter': { const f = byId('offers', id); if (!f) return; ui.drafts.counter = { fid: f.id, price: String(Math.min(num(f.listPrice), roundPrice((num(f.offeredPrice) + num(f.listPrice)) / 2))) }; ui.errors.counter = null; ui.dialog = { type: 'counter', id: f.id }; render(); break; }
    case 'new-request':
      if (!m) return;
      if (m.role !== 'pembeli') { toast('Ganti ke mode Pembeli untuk memasang permintaan.', 'info'); return; }
      ui.drafts.req = { commodity: '', category: 'sayuran', quantity: '', unit: 'kg', targetPrice: '', location: m.location, neededBy: '', frequency: FREQ[0], note: '' };
      ui.errors.req = null; openSheet('request-form'); break;
    case 'respond': {
      const r = byId('requests', id); if (!r) return;
      const mine = st().responses.find(x => x.requestId === r.id && x.sellerId === meId());
      ui.drafts.respond = { rid: r.id, price: String(mine ? mine.price : r.targetPrice), quantity: String(mine ? mine.quantity : r.quantity), note: mine ? mine.note : '' };
      ui.errors.respond = null; ui.dialog = { type: 'respond', id: r.id }; render(); break;
    }
    case 'choose-response': { const x = byId('responses', val); if (!x) return; confirmDialog('Pilih penawaran ini?', nameOf(x.sellerId) + ' · ' + rp(x.price) + ' untuk ' + qty(x.quantity) + '. Permintaan ditutup dan pesanan dibuat otomatis.', 'Pilih', false, async () => { if (await chooseResponse(id, val)) toast('Penawaran dipilih. Pesanan dibuat.', 'good'); }); break; }
    case 'close-request': confirmDialog('Tutup permintaan?', 'Petani tidak bisa mengirim penawaran baru setelah ditutup.', 'Tutup', false, async () => { if (await closeRequest(id)) toast('Permintaan ditutup', 'info'); }); break;
    case 'ask-delete-request': confirmDialog('Hapus permintaan?', 'Permintaan beserta semua penawarannya akan dihapus.', 'Hapus', true, async () => { await deleteRequest(id); ui.sheet = null; toast('Permintaan dihapus', 'info'); }); break;
    case 'edit-profile': if (!m) return; ui.drafts.profile = { name: m.name, business: m.businessName || '', phone: m.phone, location: m.location }; ui.errors.profile = null; openSheet('profile'); break;
    case 'ask-switch-role': if (!m) return; confirmDialog(m.role === 'petani' ? 'Ganti ke mode Pembeli?' : 'Ganti ke mode Petani?', m.role === 'petani' ? 'Anda akan melihat Pasar, Keranjang, dan Permintaan Saya. Produk Anda tetap tersimpan.' : 'Anda akan melihat Beranda petani, Produk Saya, dan Permintaan Pembeli. Keranjang dikosongkan.', 'Ganti', false, () => switchRole()); break;
    case 'toggle-sim': ui.sim = !ui.sim; writePref('sim', ui.sim); render(); if (ui.sim) runBots(); break;
    case 'seed-shared': confirmDialog('Isi ulang data contoh?', 'Petani, produk, dan permintaan contoh dimuat ulang ke pasar bersama. Data pengguna tidak dihapus.', 'Muat', false, () => seedSharedDemo()); break;
    case 'confirm-yes': {
      const run = ui.dialog && ui.dialog.run;
      ui.dialog = null; render();
      if (run) await run();
      break;
    }
    default: break;
  }
}

async function onSubmit(e) {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const kind = form.getAttribute('data-form');
  const d = ui.drafts[kind] || {};
  if (ui.busy) return;
  ui.busy = true;
  try {
    if (kind === 'reg') { ui.errors.reg = await createProfile(d); render(); }
    else if (kind === 'login') {
      const p = findByPhone(d.phone);
      if (!p) { ui.errors.login = 'Nomor belum terdaftar. Periksa lagi atau pilih tab Daftar.'; render(); }
      else { ui.errors.login = null; app.backend.setMe(p.id); ui.tab = homeTab(p.role); location.hash = ui.tab; toast('Selamat datang kembali, ' + str(p.name).split(' ')[0], 'good'); }
    }
    else if (kind === 'prod') { const err = await saveProduct(d); ui.errors.prod = err; if (!err) { ui.sheet = null; } render(); }
    else if (kind === 'req') { const err = await postRequest(d); ui.errors.req = err; if (!err) { ui.sheet = null; if (ui.tab !== 'permintaan') goTab('permintaan'); } render(); }
    else if (kind === 'profile') { const err = await updateProfile(d); ui.errors.profile = err; if (!err) { ui.sheet = null; toast('Profil diperbarui', 'good'); } render(); }
    else if (kind === 'checkout') {
      if (str(d.address).trim().length < 5) { ui.errors.checkout = 'Isi alamat pengiriman.'; render(); }
      else {
        const n = await checkout(d);
        if (n) { ui.sheet = null; ui.drafts.checkout = null; ui.ordersTab = 'pesanan'; ui.ordersHistory = false; toast(n > 1 ? n + ' pesanan dibuat (dipisah per petani)' : 'Pesanan berhasil dibuat', 'good'); goTab('pesanan'); }
        else { ui.errors.checkout = 'Pesanan belum terbuat. Coba lagi.'; render(); }
      }
    }
    else if (kind === 'offer') {
      const p = prod(ui.dialog && ui.dialog.id); if (!p) { closeDialog(); return; }
      const q = num(digits(d.quantity, 7)); const price = num(digits(d.price, 10)); const minQ = minQtyOf(p);
      let err = null;
      if (q < minQ) err = 'Jumlah minimal ' + qty(minQ) + ' ' + p.unit + '.';
      else if (q > num(p.stock)) err = 'Jumlah melebihi stok (' + qty(p.stock) + ' ' + p.unit + ').';
      else if (price <= 0) err = 'Masukkan harga tawaran.';
      else if (price >= num(p.price)) err = 'Tawaran harus di bawah harga petani. Untuk harga normal, gunakan Tambah ke keranjang.';
      else if (price * 2 < num(p.price)) err = 'Tawaran terlalu rendah. Ajukan minimal ' + rp(Math.ceil(num(p.price) / 2)) + '/' + p.unit + ' (separuh harga petani).';
      ui.errors.offer = err;
      if (!err && await makeOffer(p.id, q, price, d.note)) { ui.dialog = null; toast('Tawaran terkirim. Pantau di Pesanan → Nego harga.', 'good'); }
      render();
    }
    else if (kind === 'counter') {
      const f = byId('offers', ui.dialog && ui.dialog.id); if (!f) { closeDialog(); return; }
      const price = num(digits(d.price, 10));
      let err = null;
      if (price <= num(f.offeredPrice)) err = 'Harga harus di atas tawaran pembeli (' + rp(f.offeredPrice) + ').';
      else if (price > num(f.listPrice)) err = 'Harga tidak boleh melebihi harga awal (' + rp(f.listPrice) + ').';
      ui.errors.counter = err;
      if (!err && await counterOffer(f.id, price)) { ui.dialog = null; toast('Tawar balik ' + rp(price) + '/' + f.unit + ' terkirim', 'good'); }
      render();
    }
    else if (kind === 'respond') {
      const r = byId('requests', ui.dialog && ui.dialog.id); if (!r) { closeDialog(); return; }
      const price = num(digits(d.price, 10)); const q = num(digits(d.quantity, 7));
      let err = null;
      if (price <= 0) err = 'Masukkan harga penawaran.';
      else if (q <= 0) err = 'Masukkan jumlah yang sanggup Anda penuhi.';
      ui.errors.respond = err;
      if (!err && await respondRequest(r.id, price, q, d.note)) { ui.dialog = null; toast('Penawaran terkirim ke ' + nameOf(r.buyerId), 'good'); }
      render();
    }
  } finally { ui.busy = false; }
}

let liveTimer = null;
function onInput(e) {
  const t = e.target;
  const bind = t.getAttribute && t.getAttribute('data-bind');
  if (bind) {
    let v = t.value;
    const n = t.getAttribute('data-num');
    if (n) { const c = digits(v, num(n, 10)); if (c !== v) { const pos = Math.max(0, (t.selectionStart || c.length) - (v.length - c.length)); t.value = c; try { t.setSelectionRange(pos, pos); } catch (err) { /* abaikan */ } } v = c; }
    setPath(bind, v);
    if (bind === 'login.phone') { const b = $('form[data-form="login"] button[type="submit"]'); if (b) b.disabled = digits(v).length < 9; }
    return;
  }
  const live = t.getAttribute && t.getAttribute('data-live');
  if (live === 'market.q') {
    ui.market.q = t.value.slice(0, 60);
    clearTimeout(liveTimer);
    liveTimer = setTimeout(render, 160);
    return;
  }
  const qtyKind = t.getAttribute && t.getAttribute('data-qty');
  if (qtyKind) { const c = digits(t.value, 7); if (c !== t.value) t.value = c; }
}
async function onChange(e) {
  const t = e.target;
  const pick = t.getAttribute && t.getAttribute('data-pick');
  if (pick === 'market.loc') { ui.market.loc = t.value; render(); return; }
  if (pick === 'market.sort') { ui.market.sort = t.value; render(); return; }
  const qtyKind = t.getAttribute && t.getAttribute('data-qty');
  if (qtyKind) {
    const id = t.getAttribute('data-id'); const p = prod(id); if (!p) return;
    const minQ = minQtyOf(p); const v = Math.max(minQ, Math.min(Math.max(num(p.stock), minQ), num(digits(t.value, 7), minQ)));
    if (qtyKind === 'cart') await setCartQty(id, v);
    else { (ui.drafts.qty || (ui.drafts.qty = {}))[id] = v; render(); }
    return;
  }
  if (t.getAttribute && t.getAttribute('data-file') === 'photo' && t.files && t.files[0]) {
    const file = t.files[0];
    if (!/^image\//.test(file.type)) { toast('Pilih file gambar (JPG/PNG).', 'bad'); return; }
    ui.photoBusy = true; render();
    try {
      const url = await compressImage(file);
      if (ui.drafts.prod) ui.drafts.prod.photo = url;
    } catch (err) { toast('Foto gagal diproses. Coba foto lain.', 'bad'); }
    ui.photoBusy = false; render();
  }
}
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('gagal')); };
    img.src = url;
  });
}
async function compressImage(file) {
  const img = await loadImage(file);
  let max = 720, quality = 0.78, out = '';
  for (let attempt = 0; attempt < 5; attempt++) {
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    out = c.toDataURL('image/jpeg', quality);
    if (out.length < 160000) break;
    max = Math.round(max * 0.8); quality = Math.max(0.5, quality - 0.08);
  }
  if (!safeImg(out)) throw new Error('format');
  return out;
}
function onKey(e) {
  if (e.key === 'Escape') { if (ui.dialog) closeDialog(); else if (ui.sheet) closeSheet(); }
}
function onHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  ui.tab = h;
  ui.sheet = null; ui.dialog = null;
  render();
  window.scrollTo(0, 0);
}

/* =====================================================================
   Mulai
   ===================================================================== */
function onData() {
  watchChanges();
  runBots();
  scheduleRender();
}
function startLocal(noteText) {
  app.mode = 'local';
  app.localNote = noteText || '';
  app.backend = new LocalBackend(() => onData());
  ui.tab = decodeURIComponent(location.hash.slice(1));
  onData();
}
function startShared(db, uid) {
  app.mode = 'shared';
  app.uid = uid;
  ui.tab = decodeURIComponent(location.hash.slice(1));
  const timer = setTimeout(() => {
    if (app.backend && app.backend.confirmed.size < COLLS.length) { app.note = 'Data pasar belum bisa dimuat sepenuhnya. Periksa koneksi internet; halaman akan memperbarui sendiri.'; scheduleRender(); }
  }, 10000);
  app.backend = new SharedBackend(db, uid, (c) => {
    if (app.note && app.backend && app.backend.confirmed.size === COLLS.length) { app.note = ''; clearTimeout(timer); }
    onData();
  }, (c, err) => {
    clearTimeout(timer);
    const code = err && err.code;
    if (code === 'revoked') app.note = 'Akses ke pasar bersama berakhir. Muat ulang halaman dari claude.ai.';
    else app.note = 'Sebagian data pasar tidak bisa dimuat (' + (code || 'galat') + '). Coba muat ulang halaman nanti.';
    scheduleRender();
  });
  scheduleRender();
}
async function boot() {
  document.addEventListener('click', e => { onClick(e).catch(() => {}); });
  document.addEventListener('submit', e => { onSubmit(e).catch(() => { ui.busy = false; }); });
  document.addEventListener('input', onInput);
  document.addEventListener('change', e => { onChange(e).catch(() => {}); });
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', onHash);
  setInterval(() => { if (app.mode !== 'loading') { regionCache.delete($('#app')); scheduleRender(); } }, 60000);
  const host = window.claude;
  if (!host || typeof host.use !== 'function') { startLocal(''); return; }
  scheduleRender();
  setTimeout(() => { if (app.mode === 'loading') { ui.loadSlow = true; scheduleRender(); } }, 4000);
  const stillLoading = () => app.mode === 'loading';
  let db = null, user = null;
  try { const r = await Promise.all([host.use('db'), host.use('user')]); db = r[0]; user = r[1]; } catch (e) { db = null; }
  let uid = null;
  if (db && user) { try { uid = await user.id(); } catch (e) { uid = null; } }
  if (!stillLoading()) return;
  if (!db || !uid) { startLocal(''); return; }
  let canW = null;
  try { canW = await user.can('data.write'); } catch (e) { canW = null; }
  try { app.isOwner = !!(await user.isOwner()); } catch (e) { app.isOwner = false; }
  if (!stillLoading()) return;
  if (canW === false) {
    startLocal('Anda hanya punya akses lihat ke pasar bersama, jadi mode demo yang dibuka. Minta pemilik halaman memberi akses Contributor untuk ikut bertransaksi.');
    return;
  }
  try { const v = await user.me(); app.prefillName = v && v.name ? str(v.name, 60) : ''; } catch (e) { /* abaikan */ }
  if (!stillLoading()) return;
  startShared(db, uid);
}
boot();
})();
