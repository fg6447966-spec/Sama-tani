<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sama Tani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root {
  /* Sama Tani: hijau padi untuk aksi & navigasi, kuning panen untuk harga & sorotan, netral kehijauan.
     Layout: sidebar hijau tua di desktop; top bar + bottom nav di HP; isi berupa kartu dan grid produk. */
  --bg: #F3F6EF;
  --surface: #FFFFFF;
  --surface-2: #EDF2E7;
  --ink: #15241A;
  --muted: #5A6A5E;
  --line: #DAE2D3;
  --brand: #1D7A3E;
  --brand-ink: #FFFFFF;
  --brand-soft: #DCEFE0;
  --brand-deep: #123D24;
  --accent: #C98A0C;
  --accent-soft: #FBEFD2;
  --good: #1E6B35; --good-soft: #DFF1E3;
  --warn: #8A5A00; --warn-soft: #FFF0D3;
  --info: #1D5DAE; --info-soft: #E2ECFA;
  --teal: #0E6E66; --teal-soft: #DBF2EE;
  --bad: #B3261E; --bad-soft: #FBE4E2;
  --side-bg: #123D24; --side-ink: #E7F2E9; --side-muted: #A9C3AE;
  --side-hover: rgba(255,255,255,.07); --side-on: rgba(255,255,255,.14);
  --tint-mix: 100%;
  --shadow: 0 1px 2px rgba(21,36,26,.05), 0 6px 18px rgba(21,36,26,.06);
  --font-display: "Bricolage Grotesque", "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1510; --surface: #141F18; --surface-2: #1A271F; --ink: #E4EDE5; --muted: #9AAE9F; --line: #26362B;
    --brand: #4CB872; --brand-ink: #062111; --brand-soft: #173523; --brand-deep: #0A2615;
    --accent: #F0B640; --accent-soft: #33280F;
    --good: #7DD69A; --good-soft: #15331F; --warn: #F3C46A; --warn-soft: #36290E;
    --info: #8DB7F5; --info-soft: #172840; --teal: #6BDDCB; --teal-soft: #11302B; --bad: #FF9B90; --bad-soft: #3B1A17;
    --side-bg: #0A2615; --side-ink: #DDEBE0; --side-muted: #8FAE97;
    --tint-mix: 16%;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1510; --surface: #141F18; --surface-2: #1A271F; --ink: #E4EDE5; --muted: #9AAE9F; --line: #26362B;
  --brand: #4CB872; --brand-ink: #062111; --brand-soft: #173523; --brand-deep: #0A2615;
  --accent: #F0B640; --accent-soft: #33280F;
  --good: #7DD69A; --good-soft: #15331F; --warn: #F3C46A; --warn-soft: #36290E;
  --info: #8DB7F5; --info-soft: #172840; --teal: #6BDDCB; --teal-soft: #11302B; --bad: #FF9B90; --bad-soft: #3B1A17;
  --side-bg: #0A2615; --side-ink: #DDEBE0; --side-muted: #8FAE97;
  --tint-mix: 16%;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body.no-scroll { overflow: hidden; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
a { color: var(--brand); }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.strong { font-weight: 700; }
.price { color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; }
.ic { width: 1.15em; height: 1.15em; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.ellip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hr { height: 1px; background: var(--line); border: 0; margin: 4px 0; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 0 16px; border-radius: 11px; border: 1px solid transparent;
  font-weight: 650; font-size: 14px; text-decoration: none; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .05s;
}
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--brand); color: var(--brand-ink); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-outline { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-outline:hover { border-color: var(--brand); color: var(--brand); }
.btn-ghost { background: transparent; color: var(--brand); padding: 0 10px; }
.btn-ghost:hover { background: var(--brand-soft); }
.btn-danger { background: var(--bad-soft); color: var(--bad); }
.btn-accent { background: var(--accent); color: #241700; }
.btn-wa { background: #1F9D55; color: #fff; }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
.btn-block { width: 100%; }
.icon-btn {
  position: relative; display: inline-grid; place-items: center; width: 40px; height: 40px;
  border-radius: 11px; border: 0; background: transparent; color: inherit;
}
.icon-btn:hover { background: var(--surface-2); }
.dot-badge {
  position: absolute; top: 3px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
}

/* ---------- Pills & chips ---------- */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.t-good { background: var(--good-soft); color: var(--good); }
.t-warn { background: var(--warn-soft); color: var(--warn); }
.t-info { background: var(--info-soft); color: var(--info); }
.t-teal { background: var(--teal-soft); color: var(--teal); }
.t-bad { background: var(--bad-soft); color: var(--bad); }
.t-gray { background: var(--surface-2); color: var(--muted); }
.t-brand { background: var(--brand-soft); color: var(--brand); }
.t-accent { background: var(--accent-soft); color: var(--accent); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none; min-height: 36px; padding: 0 14px;
  border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: 13px; font-weight: 600;
}
.chip:hover { border-color: var(--brand); }
.chip.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.card-pad { padding: 16px; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card-head h3 { font-size: 16px; }
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; align-items: center; gap: 10px; }
.section-head h2 { font-size: 19px; flex: 1; }
.empty {
  display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  padding: 36px 20px; color: var(--muted);
}
.empty .ic { width: 40px; height: 40px; color: var(--brand); opacity: .8; }
.empty h3 { color: var(--ink); font-size: 17px; }
.note {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px;
  background: var(--accent-soft); color: var(--ink); font-size: 14px;
}
.note .ic { color: var(--accent); margin-top: 2px; }
.note.info { background: var(--info-soft); }
.note.info .ic { color: var(--info); }
.note.bad { background: var(--bad-soft); }
.note.bad .ic { color: var(--bad); }

/* ---------- Form ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field-label { font-size: 13px; font-weight: 650; color: var(--muted); }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.textarea { min-height: 88px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.input-wrap { position: relative; display: flex; align-items: center; }
.input-wrap .pre, .input-wrap .suf { position: absolute; color: var(--muted); font-size: 14px; pointer-events: none; }
.input-wrap .pre { left: 12px; }
.input-wrap .suf { right: 12px; }
.input-wrap .input.has-pre { padding-left: 38px; }
.input-wrap .input.has-suf { padding-right: 56px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } }
.form-error { color: var(--bad); font-size: 14px; font-weight: 600; }
.radio-list { display: flex; flex-direction: column; gap: 8px; }
.radio {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--surface); text-align: left; width: 100%;
}
.radio .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
.radio.on { border-color: var(--brand); background: var(--brand-soft); }
.radio.on .dot { border-color: var(--brand); box-shadow: inset 0 0 0 4px var(--surface); background: var(--brand); }
.role-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.role-card {
  display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 14px; text-align: left;
  border: 1.5px solid var(--line); background: var(--surface);
}
.role-card .ic { width: 26px; height: 26px; color: var(--brand); }
.role-card.on { border-color: var(--brand); background: var(--brand-soft); }
.role-card b { font-size: 15px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
.stepper button { width: 38px; height: 40px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); }
.stepper button:hover { color: var(--brand); }
.stepper button[disabled] { opacity: .35; cursor: not-allowed; }
.stepper input { width: 72px; height: 40px; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); text-align: center; background: transparent; font-weight: 700; font-variant-numeric: tabular-nums; }
.stepper input:focus { outline: none; background: var(--brand-soft); }
.photo-pick {
  position: relative; display: grid; place-items: center; height: 190px; border-radius: 14px; overflow: hidden;
  border: 1.5px dashed var(--line); background: var(--surface-2); cursor: pointer;
}
.photo-pick img { width: 100%; height: 100%; object-fit: cover; }
.photo-pick .ph-label {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px;
  background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 650; box-shadow: var(--shadow);
}
.photo-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.switch { display: flex; align-items: center; gap: 12px; padding: 10px 0; text-align: left; width: 100%; background: none; border: 0; }
.switch .track { width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch.on .track { background: var(--brand); }
.switch.on .track::after { left: 21px; }

/* ---------- Product visuals ---------- */
.thumb { position: relative; display: grid; place-items: center; overflow: hidden; background: color-mix(in srgb, var(--tint, #ECEFF1) var(--tint-mix), var(--surface-2)); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .emo { font-size: 44px; line-height: 1; }
.cat-sayuran { --tint: #DDF0D3; } .cat-buah { --tint: #FFEDBE; } .cat-cabai { --tint: #FCD9D3; }
.cat-padi { --tint: #F3E6BF; } .cat-umbi { --tint: #EEDFCF; } .cat-kebun { --tint: #E6D8CC; }
.cat-ternak { --tint: #FBE3CC; } .cat-ikan { --tint: #D3E9F6; } .cat-lainnya { --tint: #E6EAEC; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 14px; }
@media (max-width: 420px) { .pgrid { grid-template-columns: 1fr 1fr; gap: 10px; } }
.pcard {
  display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
  transition: transform .12s, box-shadow .12s, border-color .12s;
}
.pcard:hover { transform: translateY(-2px); border-color: var(--brand); }
.pcard .thumb { aspect-ratio: 4 / 3; width: 100%; }
.pcard .pc-body { display: flex; flex-direction: column; gap: 3px; padding: 11px 12px 13px; }
.pcard .pc-name { font-weight: 700; font-size: 14px; line-height: 1.3; min-height: 2.6em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pcard .pc-price { font-size: 16px; }
.pcard .pc-meta { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.pcard .pc-meta .ic { width: 13px; height: 13px; }
.pcard .pc-foot { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.grade { position: absolute; top: 8px; left: 8px; }

/* ---------- List rows ---------- */
.list { display: flex; flex-direction: column; gap: 10px; }
.lrow {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
}
button.lrow:hover { border-color: var(--brand); }
.lrow .thumb { width: 64px; height: 64px; border-radius: 12px; flex: none; }
.lrow .thumb .emo { font-size: 28px; }
.lrow .lr-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.lrow .lr-title { font-weight: 700; }
.lrow .lr-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.ocard { display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
button.ocard:hover { border-color: var(--brand); }
.ocard .oc-top { display: flex; align-items: center; gap: 8px; }
.ocard .oc-code { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .02em; flex: 1; }
.ocard .oc-mid { display: flex; align-items: center; gap: 12px; }
.ocard .oc-bot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.emo-tile { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; font-size: 24px; flex: none; background: color-mix(in srgb, var(--tint, #ECEFF1) var(--tint-mix), var(--surface-2)); }
.kv { display: grid; grid-template-columns: minmax(110px, 40%) 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-weight: 600; overflow-wrap: anywhere; }
.kv dd.hl { color: var(--brand); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.tile .ic { color: var(--brand); width: 18px; height: 18px; }
.tile span { font-size: 12px; color: var(--muted); }
.tile b { font-size: 14px; overflow-wrap: anywhere; }

/* ---------- Stats ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
a.stat, a.stat:hover { text-decoration: none; color: inherit; }
a.stat:hover { border-color: var(--brand); }
.stat { display: flex; flex-direction: column; gap: 6px; padding: 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
button.stat:hover { border-color: var(--brand); }
.stat .st-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
.stat .st-top .ic { color: var(--brand); }
.stat .st-val { font-family: var(--font-display); font-size: 26px; font-weight: 750; font-variant-numeric: tabular-nums; }
.stat.attn { border-color: var(--accent); background: linear-gradient(0deg, var(--accent-soft), var(--accent-soft)) padding-box; }
.qa { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.qa a, .qa button { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--brand-soft); color: var(--ink); text-decoration: none; font-weight: 650; font-size: 14px; text-align: left; }
.qa .ic { color: var(--brand); width: 22px; height: 22px; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
.side { display: none; }
.main-col { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--brand-deep); color: #fff;
}
.topbar .icon-btn:hover { background: rgba(255,255,255,.1); }
.tb-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.tb-title { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-actions { display: flex; align-items: center; gap: 4px; }
.tb-logo { display: inline-flex; }
.view { width: 100%; max-width: 1180px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 22px; }
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: var(--surface); border-top: 1px solid var(--line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
}
.bn-link { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 650; }
.bn-link .ic { width: 22px; height: 22px; }
.bn-link.on { color: var(--brand); }
.bn-link.on .ic { background: var(--brand-soft); border-radius: 99px; padding: 3px 14px; width: 52px; height: 28px; box-sizing: border-box; }
.bn-link .badge { position: absolute; top: 2px; left: calc(50% + 8px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 10px; line-height: 17px; text-align: center; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: -0.02em; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; color: #18300F; flex: none; }
.logo .ic { width: 22px; height: 22px; }
.mode-chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 99px; font-size: 12px; font-weight: 650; background: rgba(255,255,255,.1); color: inherit; width: fit-content; }
.mode-chip .live { width: 8px; height: 8px; border-radius: 50%; background: #5BE38A; box-shadow: 0 0 0 3px rgba(91,227,138,.25); }
.mode-chip .demo { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
@media (min-width: 960px) {
  .shell { grid-template-columns: 256px minmax(0, 1fr); }
  .side {
    display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    padding: 22px 14px; background: var(--side-bg); color: var(--side-ink);
  }
  .side-nav { display: flex; flex-direction: column; gap: 3px; }
  .side-link { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 11px; color: var(--side-ink); text-decoration: none; font-weight: 600; font-size: 14px; }
  .side-link:hover { background: var(--side-hover); }
  .side-link.on { background: var(--side-on); }
  .side-link.on .ic { color: var(--accent); }
  .side-link .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: #241700; font-size: 11px; font-weight: 800; line-height: 20px; text-align: center; }
  .side-sep { height: 1px; background: rgba(255,255,255,.1); margin: 6px 4px; }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .side-user { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,.06); }
  .side-user .su-name { font-weight: 700; font-size: 14px; }
  .side-user .su-role { font-size: 12px; color: var(--side-muted); }
  .topbar { background: var(--bg); color: var(--ink); padding: 18px 28px 6px; position: sticky; }
  .topbar .icon-btn:hover { background: var(--surface-2); }
  .tb-logo { display: none; }
  .tb-title { font-size: 26px; }
  .view { padding: 14px 28px 48px; }
  .bottom-nav { display: none; }
}
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff; flex: none; }
.avatar.lg { width: 64px; height: 64px; font-size: 22px; }
.banner { margin: 10px 16px 0; }
@media (min-width: 960px) { .banner { margin: 8px 28px 0; } }

/* ---------- Hero blocks ---------- */
.hello {
  display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 20px; border-radius: 18px;
  background: var(--brand-deep); color: #fff; position: relative; overflow: hidden;
}
.hello h2 { font-size: 24px; }
.hello .sub { color: rgba(255,255,255,.78); font-size: 14px; }
.hello .money { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-radius: 14px; background: rgba(255,255,255,.1); }
.hello .money b { font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.hello .money span { font-size: 12px; color: rgba(255,255,255,.75); }
.hello::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(232,164,23,.35), rgba(232,164,23,0) 70%); pointer-events: none; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { position: relative; flex: 1 1 260px; }
.search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search .input { padding-left: 38px; border-radius: 99px; }
.toolbar .select { width: auto; min-width: 150px; border-radius: 99px; }
@media (max-width: 720px) { .toolbar .select { flex: 1 1 140px; min-width: 0; } }
.promo { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.promo a, .promo button { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--accent-soft); color: var(--ink); text-decoration: none; text-align: left; }
.promo .ic { width: 26px; height: 26px; color: var(--accent); }
.promo b { display: block; font-size: 15px; }
.promo span { font-size: 13px; color: var(--muted); }

/* ---------- Welcome ---------- */
.welcome { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); background: var(--bg); }
@media (min-width: 960px) { .welcome { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); } }
.w-hero { background: var(--brand-deep); color: #fff; padding: 28px 22px 32px; display: flex; flex-direction: column; gap: 22px; position: relative; overflow: hidden; }
@media (min-width: 960px) { .w-hero { padding: 48px 56px; justify-content: center; } }
.w-hero h1 { font-size: clamp(30px, 4.4vw, 48px); font-weight: 800; letter-spacing: -0.02em; max-width: 14ch; }
.w-hero h1 em { font-style: normal; color: var(--accent); }
.w-hero .lead { font-size: 16px; color: rgba(255,255,255,.82); max-width: 52ch; }
.w-points { display: flex; flex-direction: column; gap: 12px; }
.w-point { display: flex; gap: 12px; align-items: flex-start; }
.w-point .ic { width: 22px; height: 22px; color: var(--accent); margin-top: 2px; }
.w-point b { display: block; }
.w-point span { color: rgba(255,255,255,.75); font-size: 14px; }
.w-stats { display: flex; flex-wrap: wrap; gap: 10px; }
.w-stat { padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,.08); }
.w-stat b { display: block; font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.w-stat span { font-size: 12px; color: rgba(255,255,255,.72); }
.w-hero .field-art { position: absolute; right: -60px; top: -60px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(232,164,23,.3), rgba(232,164,23,0) 70%); pointer-events: none; }
.w-form { padding: 24px 18px 48px; display: flex; justify-content: center; }
@media (min-width: 960px) { .w-form { padding: 48px; align-items: center; } }
.w-card { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 12px; background: var(--surface-2); gap: 4px; }
.seg button { min-height: 38px; border: 0; border-radius: 9px; background: transparent; font-weight: 650; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.demo-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- Overlay (sheet & dialog) ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: rgba(8,18,12,.5); }
.sheet {
  position: relative; width: 100%; max-width: 780px; max-height: 94%; display: flex; flex-direction: column;
  background: var(--bg); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 40px rgba(0,0,0,.25); overflow: hidden;
}
.sheet.narrow { max-width: 460px; }
@media (min-width: 720px) {
  .overlay { align-items: center; padding: 24px; }
  .sheet { border-radius: 20px; max-height: 90%; }
}
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 18px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 18px; flex: 1; min-width: 0; }
.sheet-body { overflow-y: auto; padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain; }
.sheet-body > * { flex-shrink: 0; }
.sheet-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); }
.sheet-foot .grow { min-width: 140px; }
.hero-img { margin: -16px -18px 0; height: 260px; }
.hero-img .emo { font-size: 96px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.step { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); text-align: center; }
.step i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-style: normal; font-weight: 800; color: var(--muted); }
.step.done { color: var(--ink); font-weight: 650; }
.step.done i { background: var(--brand); color: var(--brand-ink); }

/* ---------- Toast ---------- */
#toast-root { position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top)); z-index: 80; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 440px); pointer-events: none; }
@media (min-width: 960px) { #toast-root { top: auto; bottom: 24px; left: auto; right: 24px; transform: none; } }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); box-shadow: 0 8px 28px rgba(0,0,0,.25); font-size: 14px; pointer-events: auto; animation: rise .2s ease-out; }
.toast .ic { flex: none; color: var(--accent); }
.toast.good .ic { color: #5BE38A; }
.toast.bad .ic { color: #FF8A80; }
@keyframes rise { from { transform: translateY(8px); opacity: .4; } to { transform: none; opacity: 1; } }
.loading { min-height: 100%; display: grid; place-items: center; gap: 12px; padding: 40px; text-align: center; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--brand-soft); border-top-color: var(--brand); animation: spin 0.9s linear infinite; margin: 0 auto 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th, .table td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; }
.table th { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.table td.r, .table th.r { text-align: right; }
.table-wrap { overflow-x: auto; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
@media (min-width: 1100px) { .two-col { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); }
.tabs button { position: relative; padding: 10px 14px; border: 0; background: none; font-weight: 700; font-size: 14px; color: var(--muted); }
.tabs button.on { color: var(--brand); }
.tabs button.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--brand); }
.notif { display: flex; gap: 12px; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.notif .ic { color: var(--brand); margin-top: 2px; }
.notif.unread { border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

/* =====================================================================
   Penyimpanan: lokal (mode demo) & bersama (database artifact)
   ===================================================================== */
const COLLS = ['profiles', 'products', 'orders', 'offers', 'requests', 'responses'];
const LS_KEY = 'samatani-web-data-v1';

function cleanDoc(d) { return JSON.parse(JSON.stringify(d)); }

class LocalBackend {
  constructor(onChange) {
    this.mode = 'local';
    this.onChange = onChange;
    this.loaded = new Set(COLLS);
    const saved = this.load();
    this.state = saved ? saved.state : localSeed(now());
    this.meId = saved ? saved.meId : null;
  }
  load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      const o = JSON.parse(raw);
      if (!o || !o.state || !Array.isArray(o.state.products)) return null;
      for (const c of COLLS) if (!Array.isArray(o.state[c])) o.state[c] = [];
      if (!Array.isArray(o.state.cart)) o.state.cart = [];
      return o;
    } catch (e) { return null; }
  }
  save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ state: this.state, meId: this.meId })); }
    catch (e) { if (!this.warned) { this.warned = true; toast('Penyimpanan browser penuh. Perubahan terbaru mungkin tidak tersimpan.', 'bad'); } }
  }
  commit(c) { this.save(); this.onChange(c); }
  async put(c, doc) {
    const d = cleanDoc(doc); const arr = this.state[c]; const i = arr.findIndex(x => x.id === d.id);
    if (i >= 0) arr[i] = d; else arr.unshift(d);
    this.commit(c);
  }
  async patch(c, id, part) {
    const arr = this.state[c]; const i = arr.findIndex(x => x.id === id);
    if (i < 0) return;
    arr[i] = Object.assign({}, arr[i], cleanDoc(part));
    this.commit(c);
  }
  async remove(c, id) { this.state[c] = this.state[c].filter(x => x.id !== id); this.commit(c); }
  async setCart(items) { this.state.cart = cleanDoc(items); this.commit('cart'); }
  setMe(id) { this.meId = id; this.state.cart = []; this.commit('me'); }
  reset() { this.state = localSeed(now()); this.meId = null; this.commit('reset'); }
}

class SharedBackend {
  constructor(db, uid, onChange, onError) {
    this.mode = 'shared';
    this.db = db;
    this.meId = uid;
    this.onChange = onChange;
    this.state = { profiles: [], products: [], orders: [], offers: [], requests: [], responses: [], cart: [] };
    this.raw = { profiles: [], products: [], orders: [], offers: [], requests: [], responses: [] };
    this.rawCart = [];
    this.loaded = new Set();
    this.confirmed = new Set();
    this.queues = new Map();
    this.pending = new Map();   // 'koleksi/id' -> daftar tulisan yang belum dikonfirmasi
    this.cartPending = [];
    this.unsubs = [];
    for (const c of COLLS) {
      this.unsubs.push(db.collection(c).onSnapshot(snap => {
        this.raw[c] = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
        this.rebuild(c);
        this.loaded.add(c);
        if (!(snap.metadata && snap.metadata.fromCache)) this.confirmed.add(c);
        onChange(c);
      }, err => onError(c, err)));
    }
    this.cartRef = db.doc('data/users/' + uid + '/cart');
    this.unsubs.push(this.cartRef.onSnapshot(snap => {
      const items = snap.exists ? (snap.data() || {}).items : [];
      this.rawCart = Array.isArray(items) ? items.map(x => Object.assign({}, x)) : [];
      this.rebuildCart();
      onChange('cart');
    }, err => onError('cart', err)));
  }
  /* Tampilan = data dari server + tulisan sendiri yang masih menunggu konfirmasi,
     supaya snapshot lama tidak sempat "membalik" perubahan yang baru dibuat. */
  rebuild(c) {
    const arr = this.raw[c].slice();
    const pre = c + '/';
    for (const [key, list] of this.pending) {
      if (!key.startsWith(pre)) continue;
      const id = key.slice(pre.length);
      for (const w of list) {
        const i = arr.findIndex(x => x.id === id);
        if (w.kind === 'remove') { if (i >= 0) arr.splice(i, 1); }
        else if (w.kind === 'put') { if (i >= 0) arr[i] = w.data; else arr.unshift(w.data); }
        else if (i >= 0) arr[i] = Object.assign({}, arr[i], w.data);
      }
    }
    this.state[c] = arr;
  }
  rebuildCart() {
    const last = this.cartPending[this.cartPending.length - 1];
    this.state.cart = last ? last.items.map(x => Object.assign({}, x)) : this.rawCart.map(x => Object.assign({}, x));
  }
  track(c, id, kind, data, fn) {
    const key = c + '/' + id;
    const w = { kind, data };
    if (!this.pending.has(key)) this.pending.set(key, []);
    this.pending.get(key).push(w);
    this.rebuild(c);
    this.onChange(c);
    const done = failed => {
      const list = this.pending.get(key);
      if (list) { const i = list.indexOf(w); if (i >= 0) list.splice(i, 1); if (!list.length) this.pending.delete(key); }
      if (failed) { this.rebuild(c); this.onChange(c); }
    };
    const p = this.queue(key, fn);
    p.then(() => done(false), () => done(true));
    return p;
  }
  queue(path, fn) {
    const prev = this.queues.get(path) || Promise.resolve();
    const next = prev.catch(() => {}).then(fn);
    this.queues.set(path, next);
    return next;
  }
  async put(c, doc) {
    const d = cleanDoc(doc);
    return this.track(c, d.id, 'put', d, () => this.db.collection(c).doc(d.id).set(d));
  }
  async patch(c, id, part) {
    const p = cleanDoc(part);
    return this.track(c, id, 'patch', p, () => this.db.collection(c).doc(id).update(p));
  }
  async remove(c, id) {
    return this.track(c, id, 'remove', null, () => this.db.collection(c).doc(id).delete());
  }
  async setCart(items) {
    const w = { items: cleanDoc(items) };
    this.cartPending.push(w);
    this.rebuildCart();
    this.onChange('cart');
    const done = failed => {
      const i = this.cartPending.indexOf(w); if (i >= 0) this.cartPending.splice(i, 1);
      if (failed) { this.rebuildCart(); this.onChange('cart'); }
    };
    const p = this.queue('cart', () => this.cartRef.set({ items: w.items, updatedAt: now() }));
    p.then(() => done(false), () => done(true));
    return p;
  }
}

/* =====================================================================
   Toast & notifikasi
   ===================================================================== */
let toastSeq = 0;
function toast(msg, tone) {
  const id = ++toastSeq;
  ui.toasts.push({ id, msg, tone: tone || 'info' });
  if (ui.toasts.length > 4) ui.toasts.shift();
  scheduleRender();
  setTimeout(() => { ui.toasts = ui.toasts.filter(t => t.id !== id); scheduleRender(); }, 5200);
}
function notify(msg, tone, link) {
  ui.notifs.unshift({ id: ++toastSeq, msg, tone: tone || 'info', at: now(), link: link || null, read: false });
  if (ui.notifs.length > 40) ui.notifs.pop();
  ui.unread += 1;
  toast(msg, tone);
}

/* =====================================================================
   Penulisan data (dengan penanganan galat)
   ===================================================================== */
async function guard(promise) {
  try { await promise; return true; }
  catch (e) {
    const code = e && e.code;
    if (code === 'invalid_argument' && app.mode === 'shared') {
      app.readOnly = true;
      toast('Akses Anda hanya untuk melihat. Minta pemilik membagikan halaman ini dengan akses Contributor.', 'bad');
    } else if (code === 'quota_exceeded') {
      toast('Penyimpanan pasar sudah penuh. Hapus beberapa produk atau permintaan lama.', 'bad');
    } else if (code === 'resource_exhausted') {
      toast('Terlalu banyak perubahan sekaligus. Tunggu sebentar lalu coba lagi.', 'bad');
    } else {
      toast('Gagal menyimpan. Periksa koneksi internet lalu coba lagi.', 'bad');
    }
    scheduleRender();
    return false;
  }
}
const W = {
  put: (c, d) => guard(app.backend.put(c, d)),
  patch: (c, id, p) => guard(app.backend.patch(c, id, p)),
  remove: (c, id) => guard(app.backend.remove(c, id)),
  cart: items => guard(app.backend.setCart(items)),
};
function canWrite() { return !app.readOnly; }

function validateProfile(d) {
  if (str(d.name).trim().length < 3) return 'Nama minimal 3 huruf.';
  const n = digits(d.phone, 20).length;
  if (n < 9 || n > 15) return 'Nomor HP/WhatsApp tidak valid (9–15 angka).';
  if (str(d.location).trim().length < 3) return 'Isi kabupaten/kota Anda.';
  return null;
}
function findByPhone(phone) {
  const t = normPhone(phone);
  if (!t) return null;
  return st().profiles.find(p => !p.isBot && normPhone(p.phone) === t) || null;
}
async function createProfile(d) {
  const err = validateProfile(d);

function cartLines() {
  return st().cart.map(it => {
    const p = prod(it.productId);
    if (!p) return null;
    const ok = p.active !== false && num(p.stock) > 0;
    const minQ = Math.max(1, Math.min(num(p.minOrder, 1), num(p.stock)));
    const q = Math.max(minQ, Math.min(num(it.quantity, 1), Math.max(num(p.stock), minQ)));
    return { p, q, ok, minQ };
  }).filter(Boolean);
}
async function addToCart(pid, q) {

  const items = st().cart.map(x => Object.assign({}, x));

  const nq = Math.min(num(p.stock), (e ? num(e.quantity) : 0) + q);
  if (e) e.quantity = nq; else items.push({ productId: pid, quantity: nq });

/* =====================================================================
   Simulasi mitra (akun contoh membalas otomatis)
   ===================================================================== */
const botTimers = new Map();
function sched(key, ms, fn) {
  if (botTimers.has(key)) return;
  botTimers.set(key, setTimeout(async () => {
    try { await fn(); } catch (e) { /* abaikan */ }
    botTimers.delete(key);
  }, ms));
}
function runBots() {
  const m = me();
  if (!m || !ui.sim || app.readOnly) return;
  const s = st();
  for (const o of s.orders) {
    if (o.buyerId === m.id && isBot(o.sellerId)) {
      if (o.status === 'menunggu') sched('oa:' + o.id, 4000, () => orderMove(o.id, 'menunggu', 'diproses', o.sellerId));
      else if (o.status === 'diproses') sched('os:' + o.id, 9000, () => orderMove(o.id, 'diproses', 'dikirim', o.sellerId));
    }
    if (o.sellerId === m.id && isBot(o.buyerId) && o.status === 'dikirim') sched('oc:' + o.id, 7000, () => orderMove(o.id, 'dikirim', 'selesai', o.buyerId));
  }
  for (const f of s.offers) {
    if (f.buyerId === m.id && isBot(f.sellerId) && f.status === 'menunggu') {
      sched('fs:' + f.id, 5000, () => {
        const cur = byId('offers', f.id);
        if (!cur || cur.status !== 'menunggu') return;
        if (num(cur.offeredPrice) * 100 >= num(cur.listPrice) * 92) return acceptOffer(cur.id, cur.sellerId);
        const counter = Math.min(num(cur.listPrice), roundPrice((num(cur.offeredPrice) + num(cur.listPrice)) / 2));
        return counterOffer(cur.id, counter, cur.sellerId);
      });
    }
    if (f.sellerId === m.id && isBot(f.buyerId) && f.status === 'ditawar') {
      sched('fb:' + f.id, 5000, () => {
        const cur = byId('offers', f.id);
        if (!cur || cur.status !== 'ditawar') return;
        if (num(cur.counterPrice) * 100 <= num(cur.offeredPrice) * 112) return acceptOffer(cur.id, cur.buyerId);
        return rejectOffer(cur.id, cur.buyerId);
      });
    }
  }
  for (const r of s.requests) {
    if (r.status !== 'terbuka') continue;
    const resps = s.responses.filter(x => x.requestId === r.id);
    if (isBot(r.buyerId) && resps.some(x => x.sellerId === m.id)) {
      sched('rc:' + r.id, 8000, () => {
        const cur = byId('requests', r.id);
        if (!cur || cur.status !== 'terbuka') return;
        const pick = st().responses.filter(x => x.requestId === r.id && !isBot(x.sellerId)).sort((a, b) => num(a.price) - num(b.price))[0];
        if (pick) return chooseResponse(r.id, pick.id, r.buyerId);
      });
    }
    if (r.buyerId === m.id && !resps.some(x => isBot(x.sellerId)) && now() - num(r.createdAt) < 30 * MIN) {
      sched('rr:' + r.id, 7000, () => {
        const cur = byId('requests', r.id);
        if (!cur || cur.status !== 'terbuka') return;
        const farmers = st().profiles.filter(p => p.isBot && p.role === 'petani');
        if (!farmers.length) return;
        const match = farmers.find(fm => st().products.some(p => p.sellerId === fm.id && p.category === cur.category)) || farmers[0];
        const price = roundPrice(num(cur.targetPrice) * 1.04);
        return respondRequest(cur.id, price, num(cur.quantity), 'Siap memenuhi kebutuhan ini. Bisa diatur jadwal kirimnya.', match.id);
      });
    }
  }
  for (const p of s.products) {
    if (p.sellerId !== m.id || p.active === false || num(p.stock) <= 0 || now() - num(p.createdAt) > 30 * MIN) continue;
    if (s.offers.some(f => f.productId === p.id) || s.orders.some(o => (o.items || []).some(i => i.productId === p.id))) continue;
    sched('po:' + p.id, 20000, () => {
      const cur = prod(p.id);
      if (!cur || st().offers.some(f => f.productId === cur.id)) return;
      const buyers = st().profiles.filter(x => x.isBot && x.role === 'pembeli');
      if (!buyers.length) return;
      const b = buyers[Math.floor(Math.random() * buyers.length)];
      const t = now();
      const q = Math.max(num(cur.minOrder, 1), Math.min(num(cur.stock), num(cur.minOrder, 1) * 2));
      return W.put('offers', {
        id: 'botoffer-' + cur.id, productId: cur.id, productName: cur.name, category: cur.category, unit: cur.unit,
        listPrice: num(cur.price), buyerId: b.id, sellerId: m.id, quantity: q, offeredPrice: roundPrice(num(cur.price) * 0.88),
        counterPrice: null, finalPrice: null, note: 'Produk baru Anda menarik. Bisa kirim minggu ini?', status: 'menunggu',
        orderId: null, createdAt: t, updatedAt: t, updatedBy: b.id,
      });
    });
  }
}

/* =====================================================================
   Deteksi perubahan untuk notifikasi
   ===================================================================== */
let watchPrev = null;
const notifSeen = new Set();
function watchSig(k, v) {
  if (k[0] === 'o') return v.status;
  if (k[0] === 'f') return v.status + '|' + v.counterPrice;
  if (k[0] === 'x') return 'ada';
  if (k[0] === 'r') return v.status + '|' + v.chosenResponseId;
  return '';
}
function dataReady() { return app.backend && COLLS.every(c => app.backend.loaded.has(c)); }
function watchChanges() {
  const m = me();
  if (!m || !dataReady()) { watchPrev = null; return; }
  const s = st(); const cur = new Map();
  for (const o of s.orders) if (o.buyerId === m.id || o.sellerId === m.id) cur.set('o:' + o.id, o);
  for (const f of s.offers) if (f.buyerId === m.id || f.sellerId === m.id) cur.set('f:' + f.id, f);
  const mine = new Set(s.requests.filter(r => r.buyerId === m.id).map(r => r.id));
  for (const x of s.responses) if (mine.has(x.requestId) && x.sellerId !== m.id) cur.set('x:' + x.id, x);
  const responded = new Set(s.responses.filter(x => x.sellerId === m.id).map(x => x.requestId));
  for (const r of s.requests) if (responded.has(r.id) && r.buyerId !== m.id) cur.set('r:' + r.id, r);
  if (watchPrev && watchPrev.who === m.id) {
    for (const [k, v] of cur) {
      const before = watchPrev.map.get(k);
      const sig = watchSig(k, v);
      if (before === sig) continue;
      const seenKey = m.id + '|' + k + '|' + sig;
      if (notifSeen.has(seenKey)) continue;
      const msg = describeChange(k, before, v, m);
      if (msg) { notifSeen.add(seenKey); notify(msg[0], msg[1], msg[2]); }
    }
  }
  const map = new Map();
  for (const [k, v] of cur) map.set(k, watchSig(k, v));
  watchPrev = { who: m.id, map };
}
function describeChange(k, before, v, m) {
  const t = k[0];
  if (t === 'o') {
    if (v.updatedBy === m.id) return null;
    const item = (v.items || [])[0];
    const what = item ? item.name : 'pesanan';
    if (before === undefined) {
      if (v.source) return null;
      if (v.sellerId === m.id && v.status === 'menunggu') return ['Pesanan baru dari ' + nameOf(v.buyerId) + ': ' + what, 'info', { sheet: 'order', id: v.id }];
      return null;
    }
    const map = {
      diproses: [nameOf(v.sellerId) + ' menerima pesanan ' + v.code, 'good'],
      dikirim: ['Pesanan ' + v.code + ' sedang dikirim oleh ' + nameOf(v.sellerId), 'info'],
      selesai: [nameOf(v.buyerId) + ' mengonfirmasi pesanan ' + v.code + ' sudah diterima', 'good'],
      ditolak: ['Pesanan ' + v.code + ' ditolak petani', 'bad'],
      dibatalkan: ['Pesanan ' + v.code + ' dibatalkan pembeli', 'bad'],
    };
    const r = map[v.status];
    return r ? [r[0], r[1], { sheet: 'order', id: v.id }] : null;
  }
  if (t === 'f') {
    if (v.updatedBy === m.id) return null;
    if (before === undefined) {
      if (v.sellerId === m.id && v.status === 'menunggu') return [nameOf(v.buyerId) + ' menawar ' + rp(v.offeredPrice) + '/' + v.unit + ' untuk ' + v.productName, 'info', { tab: 'pesanan', ordersTab: 'nego' }];
      return null;
    }
    if (v.status === 'ditawar') return [nameOf(v.sellerId) + ' menawar balik ' + rp(v.counterPrice) + '/' + v.unit + ' untuk ' + v.productName, 'info', { tab: 'pesanan', ordersTab: 'nego' }];
    if (v.status === 'diterima') return ['Harga ' + v.productName + ' disepakati di ' + rp(v.finalPrice) + '/' + v.unit + '. Pesanan dibuat.', 'good', { tab: 'pesanan', ordersTab: 'nego' }];
    if (v.status === 'ditolak') return ['Nego untuk ' + v.productName + ' ditolak', 'bad', { tab: 'pesanan', ordersTab: 'nego' }];
    return null;
  }
  if (t === 'x') {
    if (before !== undefined) return null;
    const r = byId('requests', v.requestId);
    return [nameOf(v.sellerId) + ' menawarkan ' + rp(v.price) + ' untuk "' + (r ? r.commodity : 'permintaan Anda') + '"', 'info', { sheet: 'request', id: v.requestId }];
  }
  if (t === 'r') {
    if (v.updatedBy === m.id || v.status !== 'ditutup' || before === undefined) return null;
    const chosen = byId('responses', v.chosenResponseId);
    if (chosen && chosen.sellerId === m.id) return ['Penawaran Anda untuk "' + v.commodity + '" dipilih. Pesanan dibuat.', 'good', { sheet: 'request', id: v.id }];
    return null;
  }
  return null;
}

   Rendering
   ===================================================================== */
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
const regionCache = new WeakMap();
function patch(el, html) {
  if (!el || regionCache.get(el) === html) return;
  const active = document.activeElement;
  const aid = active && active.id && el.contains(active) ? active.id : null;
  let sel = null;
  if (aid && typeof active.selectionStart === 'number') sel = [active.selectionStart, active.selectionEnd];
  const scrolls = Array.prototype.map.call(el.querySelectorAll('[data-scroll]'), n => [n.getAttribute('data-scroll'), n.scrollTop]);
  el.innerHTML = html;
  regionCache.set(el, html);
  for (const [k, top] of scrolls) { const n = el.querySelector('[data-scroll="' + k + '"]'); if (n) n.scrollTop = top; }
  if (aid) {
    const n = document.getElementById(aid);
    if (n) { try { n.focus({ preventScroll: true }); if (sel && n.setSelectionRange) n.setSelectionRange(sel[0], sel[1]); } catch (e) { /* abaikan */ } }
  }
}
function render() {
  patch($('#app'), viewApp());
  patch($('#sheet-root'), viewOverlay());
  patch($('#toast-root'), ui.toasts.map(t => '<div class="toast ' + esc(t.tone) + '">' + icon(t.tone === 'bad' ? 'TriangleAlert' : t.tone === 'good' ? 'CircleCheck' : 'Bell') + '<span>' + esc(t.msg) + '</span></div>').join(''));
  document.body.classList.toggle('no-scroll', !!(ui.sheet || ui.dialog));
}

function orderPill(s) { const v = ORDER_ST[s] || ['-', 'gray']; return pill(v[0], v[1]); }
function offerPill(s) { const v = OFFER_ST[s] || ['-', 'gray']; return pill(v[0], v[1]); }
function avatar(p, cls) {
  const h = hue(p ? p.id : 'x');

}
function thumb(p, cls) {
  const src = safeImg(p.photo);

}
function emoTile(cat, name) { return '<span class="emo-tile cat-' + catKey(cat) + '" aria-hidden="true">' + itemEmoji(name, cat) + '</span>'; }
function empty(ic, title, msg, action) {
  return '<div class="empty">' + icon(ic) + '<h3>' + esc(title) + '</h3><p>' + esc(msg) + '</p>' + (action || '') + '</div>';

function note(ic, html, tone) { return '<div class="note ' + (tone || '') + '">' + icon(ic) + '<div>' + html + '</div></div>'; }
function kv(rows) {

function bindVal(path) {
  const parts = path.split('.');
  let o = ui.drafts;
  for (const k of parts) { if (o == null) return ''; o = o[k]; }
  return o == null ? '' : o;
}
function input(id, path, opts) {
  opts = opts || {};
  const v = bindVal(path);
  const cls = 'input' + (opts.pre ? ' has-pre' : '') + (opts.suf ? ' has-suf' : '');
  const attrs = 'id="' + id + '" class="' + cls + '" data-bind="' + path + '"' + (opts.num ? ' inputmode="numeric" data-num="' + opts.num + '"' : '') + (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '') + (opts.type ? ' type="' + opts.type + '"' : ' type="text"') + (opts.max ? ' maxlength="' + opts.max + '"' : '') + (opts.auto ? ' autocomplete="' + opts.auto + '"' : '');
  const field = (opts.pre || opts.suf)
    ? '<div class="input-wrap">' + (opts.pre ? '<span class="pre">' + esc(opts.pre) + '</span>' : '') + '<input ' + attrs + ' value="' + esc(v) + '">' + (opts.suf ? '<span class="suf">' + esc(opts.suf) + '</span>' : '') + '</div>'
    : '<input ' + attrs + ' value="' + esc(v) + '">';
  return '<div class="field ' + (opts.full ? 'full' : '') + '"><label for="' + id + '">' + esc(opts.label || '') + '</label>' + field + (opts.hint ? '<span class="xs muted">' + esc(opts.hint) + '</span>' : '') + '</div>';
}
function textarea(id, path, opts) {
  opts = opts || {};
  return '<div class="field ' + (opts.full ? 'full' : '') + '"><label for="' + id + '">' + esc(opts.label || '') + '</label><textarea id="' + id + '" class="textarea" data-bind="' + path + '"' + (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '') + (opts.max ? ' maxlength="' + opts.max + '"' : '') + '>' + esc(bindVal(path)) + '</textarea></div>';
}
function chipsPick(path, options, labelFn, wrap) {
  const cur = bindVal(path);
  return '<div class="chips ' + (wrap ? 'wrap' : '') + '">' + options.map(o => '<button type="button" class="chip ' + (o === cur ? 'on' : '') + '" data-act="set" data-path="' + path + '" data-val="' + esc(o) + '" aria-pressed="' + (o === cur) + '">' + esc(labelFn ? labelFn(o) : o) + '</button>').join('') + '</div>';
}
function radios(path, options) {
  const cur = bindVal(path);
  return '<div class="radio-list" role="radiogroup">' + options.map(o => '<button type="button" role="radio" aria-checked="' + (o === cur) + '" class="radio ' + (o === cur ? 'on' : '') + '" data-act="set" data-path="' + path + '" data-val="' + esc(o) + '"><span class="dot"></span><span>' + esc(o) + '</span></button>').join('') + '</div>';
}
function stepper(id, value, min, max, step, actPrefix, pid) {
  return '<div class="stepper"><button type="button" aria-label="Kurangi" data-act="' + actPrefix + '-dec" data-id="' + esc(pid) + '" data-step="' + step + '" ' + (value <= min ? 'disabled' : '') + '>' + icon('Minus') + '</button>' +
    '<input id="' + id + '" inputmode="numeric" aria-label="Jumlah" value="' + esc(value) + '" data-qty="' + actPrefix + '" data-id="' + esc(pid) + '">' +
    '<button type="button" aria-label="Tambah" data-act="' + actPrefix + '-inc" data-id="' + esc(pid) + '" data-step="' + step + '" ' + (value >= max ? 'disabled' : '') + '>' + icon('Plus') + '</button></div>';
}
function waButton(p, text) {
  if (!p) return '';

  const url = 'https://wa.me/' + normPhone(p.phone) + '?text=' + encodeURIComponent(text);
  return '<a class="btn btn-wa btn-sm" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + icon('MessageCircle') + 'WhatsApp</a>';
}
function contactCard(title, p, text) {
  if (!p) return '<div class="card card-pad"><p class="muted">Data pengguna tidak ditemukan.</p></div>';
  return '<div class="card card-pad stack"><span class="field-label">' + esc(title) + '</span><div class="row">' + avatar(p) +

function minQtyOf(p) { return Math.max(1, Math.min(num(p.minOrder, 1), num(p.stock))); }
function stepOf(p) { const m = num(p.minOrder, 1); return m >= 100 ? 50 : m >= 20 ? 10 : m >= 5 ? 5 : 1; }

function viewApp() {

function badgeFor(id, m) {
  const s = st();
  if (id === 'keranjang') return s.cart.length;

    if (m.role === 'petani') return s.orders.filter(o => o.sellerId === m.id && o.status === 'menunggu').length + s.offers.filter(f => f.sellerId === m.id && f.status === 'menunggu').length;

function viewTab(tab, m) {
  switch (tab) {
    case 'beranda': return viewFarmerHome(m);
    case 'produk': return viewMyProducts(m);
    case 'pasar': return viewMarket(m);
    case 'keranjang': return viewCart(m);
    case 'pesanan': return viewOrders(m);
    case 'permintaan': return viewRequests(m);
    case 'akun': return viewAccount(m);
    case 'harga': return viewPrices();
    default: return viewMarket(m);
  }
}

/* ---------- Beranda petani ---------- */
function viewFarmerHome(m) {
  const s = st();
  const mine = s.products.filter(p => p.sellerId === m.id);
  const incoming = s.orders.filter(o => o.sellerId === m.id);
  const fresh = incoming.filter(o => o.status === 'menunggu').sort((a, b) => num(b.createdAt) - num(a.createdAt));
  const toShip = incoming.filter(o => o.status === 'diproses').sort((a, b) => num(b.updatedAt) - num(a.updatedAt));
  const offers = s.offers.filter(f => f.sellerId === m.id && f.status === 'menunggu');
  const revenue = incoming.filter(o => o.status === 'selesai').reduce((a, o) => a + orderTotal(o), 0);
  const pipeline = incoming.filter(o => isActiveOrder(o.status)).reduce((a, o) => a + orderTotal(o), 0);
  const low = mine.filter(p => p.active !== false && num(p.stock) < Math.max(1, num(p.minOrder, 1)));
  const reqs = s.requests.filter(r => r.status === 'terbuka' && r.buyerId !== m.id).sort((a, b) => num(b.createdAt) - num(a.createdAt)).slice(0, 3);
  const actionItems = fresh.concat(toShip).slice(0, 4);
  return '<section class="hello"><div class="grow"><h2>Halo, ' + esc(str(m.name).split(' ')[0]) + '</h2><p class="sub">' + esc(str(m.businessName, 80) || 'Petani Sama Tani') + ' · ' + esc(str(m.location, 80)) + '</p></div>' +
      '<div class="money"><span>Penjualan selesai</span><b>' + rp(revenue) + '</b></div><div class="money"><span>Pesanan berjalan</span><b>' + rp(pipeline) + '</b></div></section>' +
    '<section class="stats">' +
      '<a class="stat" href="#produk"><span class="st-top">' + icon('Sprout') + 'Produk tampil</span><span class="st-val">' + qty(mine.filter(p => p.active !== false).length) + '</span></a>' +
      '<a class="stat' + (fresh.length ? ' attn' : '') + '" href="#pesanan" data-act="orders-tab" data-val="pesanan"><span class="st-top">' + icon('Inbox') + 'Pesanan baru</span><span class="st-val">' + qty(fresh.length) + '</span></a>' +
      '<a class="stat' + (offers.length ? ' attn' : '') + '" href="#pesanan" data-act="orders-tab" data-val="nego"><span class="st-top">' + icon('Handshake') + 'Tawaran nego</span><span class="st-val">' + qty(offers.length) + '</span></a>' +
      '<a class="stat' + (toShip.length ? ' attn' : '') + '" href="#pesanan" data-act="orders-tab" data-val="pesanan"><span class="st-top">' + icon('Truck') + 'Perlu dikirim</span><span class="st-val">' + qty(toShip.length) + '</span></a>' +
    '</section>' +
    '<section class="qa"><button data-act="new-product">' + icon('Plus') + 'Tambah produk</button><a href="#permintaan">' + icon('Megaphone') + 'Lihat permintaan</a><a href="#harga">' + icon('TrendingUp') + 'Harga pasar</a></section>' +
    (low.length ? note('TriangleAlert', '<b>Stok menipis:</b> ' + low.map(p => esc(p.name) + ' (' + qty(p.stock) + ' ' + esc(p.unit) + ')').join(', ') + '. <a href="#produk">Perbarui stok</a>') : '') +
    '<div class="two-col"><section class="section"><div class="section-head"><h2>Perlu tindakan</h2><a class="btn btn-ghost btn-sm" href="#pesanan">Semua pesanan</a></div>' +
      (actionItems.length || offers.length ? '<div class="list">' + actionItems.map(o => orderCard(o, true)).join('') + offers.slice(0, 3).map(f => offerMini(f)).join('') + '</div>' : '<div class="card">' + empty('CircleCheck', 'Semua beres', 'Belum ada pesanan atau tawaran yang menunggu tindakan Anda.') + '</div>') +
    '</section><section class="section"><div class="section-head"><h2>Permintaan pembeli terbaru</h2><a class="btn btn-ghost btn-sm" href="#permintaan">Lihat semua</a></div>' +
      (reqs.length ? '<div class="list">' + reqs.map(r => requestCard(r, m)).join('') + '</div>' : '<div class="card">' + empty('Megaphone', 'Belum ada permintaan', 'Permintaan baru dari distributor akan muncul di sini.') + '</div>') +
      '<div class="section-head" style="margin-top:8px"><h2>Harga pasar</h2><a class="btn btn-ghost btn-sm" href="#harga">Lihat semua</a></div>' + priceTable(PRICES.slice(4, 9), true) +
    '</section></div>';
}
function orderTotal(o) { return (o.items || []).reduce((a, i) => a + num(i.price) * num(i.quantity), 0); }

/* ---------- Pasar ---------- */
function marketList(m) {
  const q = ui.market.q.trim().toLowerCase();
  let list = st().products.filter(p => p.active !== false && num(p.stock) > 0 && p.sellerId !== m.id);
  if (ui.market.cat) list = list.filter(p => catKey(p.category) === ui.market.cat);
  if (ui.market.loc) list = list.filter(p => str(p.location).split(',').pop().trim() === ui.market.loc);
  if (q) list = list.filter(p => (str(p.name) + ' ' + str(p.location) + ' ' + catLabel(p.category) + ' ' + nameOf(p.sellerId)).toLowerCase().includes(q));
  const sorters = { baru: (a, b) => num(b.createdAt) - num(a.createdAt), murah: (a, b) => num(a.price) - num(b.price), mahal: (a, b) => num(b.price) - num(a.price), stok: (a, b) => num(b.stock) - num(a.stock) };
  return list.sort(sorters[ui.market.sort] || sorters.baru);
}

    '<section class="section"><div class="toolbar"><label class="search" for="f-q"><span class="sr">Cari produk</span>' + icon('Search') + '<input id="f-q" class="input" type="search" placeholder="Cari cabai, beras, Enrekang…" value="' + esc(ui.market.q) + '" data-live="market.q" autocomplete="off"></label>' +
      '<label class="sr" for="f-loc">Lokasi</label><select id="f-loc" class="select" data-pick="market.loc"><option value="">Semua provinsi</option>' + provinces.map(p => '<option value="' + esc(p) + '"' + (ui.market.loc === p ? ' selected' : '') + '>' + esc(p) + '</option>').join('') + '</select>' +
      '<label class="sr" for="f-sort">Urutkan</label><select id="f-sort" class="select" data-pick="market.sort">' + [['baru', 'Terbaru'], ['murah', 'Harga termurah'], ['mahal', 'Harga termahal'], ['stok', 'Stok terbanyak']].map(o => '<option value="' + o[0] + '"' + (ui.market.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div>' + cats + '</section>' +

/* ---------- Pesanan ---------- */
function viewOrders(m) {
  const s = st(); const seller = m.role === 'petani';
  const orders = s.orders.filter(o => seller ? o.sellerId === m.id : o.buyerId === m.id).sort((a, b) => num(b.updatedAt) - num(a.updatedAt));
  const offers = s.offers.filter(f => seller ? f.sellerId === m.id : f.buyerId === m.id).sort((a, b) => num(b.updatedAt) - num(a.updatedAt));
  const active = orders.filter(o => isActiveOrder(o.status));
  const openNego = offers.filter(f => f.status === 'menunggu' || f.status === 'ditawar').length;
  const tabs = '<div class="tabs" role="tablist"><button role="tab" class="' + (ui.ordersTab === 'pesanan' ? 'on' : '') + '" data-act="orders-tab" data-val="pesanan" aria-selected="' + (ui.ordersTab === 'pesanan') + '">Pesanan (' + active.length + ')</button><button role="tab" class="' + (ui.ordersTab === 'nego' ? 'on' : '') + '" data-act="orders-tab" data-val="nego" aria-selected="' + (ui.ordersTab === 'nego') + '">Nego harga (' + openNego + ')</button></div>';
  if (ui.ordersTab === 'nego') {
    return tabs + (offers.length ? '<div class="list">' + offers.map(f => offerCard(f, seller)).join('') + '</div>' :
      '<div class="card">' + empty('Handshake', 'Belum ada nego harga', seller ? 'Tawaran harga dari pembeli untuk produk Anda akan muncul di sini.' : 'Buka produk di Pasar lalu pilih "Nego harga".') + '</div>');
  }
  const shown = ui.ordersHistory ? orders.filter(o => !isActiveOrder(o.status)) : active;
  return tabs + '<div class="chips"><button class="chip ' + (!ui.ordersHistory ? 'on' : '') + '" data-act="orders-history" data-val="0">Berjalan</button><button class="chip ' + (ui.ordersHistory ? 'on' : '') + '" data-act="orders-history" data-val="1">Riwayat</button></div>' +
    (shown.length ? '<div class="list">' + shown.map(o => orderCard(o, seller)).join('') + '</div>' :
      '<div class="card">' + empty(ui.ordersHistory ? 'ClipboardList' : 'Inbox', ui.ordersHistory ? 'Belum ada riwayat' : 'Belum ada pesanan berjalan', seller ? 'Pesanan dari pembeli akan muncul di sini.' : 'Pesanan yang Anda buat dari Pasar akan muncul di sini.') + '</div>');

function offerCard(f, seller) {

  const rows = [
    ['Harga awal', rp(f.listPrice) + '/' + f.unit],
    ['Tawaran pembeli', rp(f.offeredPrice) + '/' + f.unit, f.status === 'menunggu'],
    f.counterPrice != null ? ['Tawar balik petani', rp(f.counterPrice) + '/' + f.unit, f.status === 'ditawar'] : null,
    ['Jumlah', qty(f.quantity) + ' ' + f.unit],

  return '<div class="ocard"><span class="oc-top">' + emoTile(f.category, f.productName) + '<span class="grow"><span class="strong ellip" style="display:block">' + esc(f.productName) + '</span><span class="small muted">' + (seller ? 'Dari ' : 'Ke ') + esc(nameOf(seller ? f.buyerId : f.sellerId)) + ' · ' + esc(timeAgo(f.updatedAt)) + '</span></span>' + offerPill(f.status) + '</span>' +

      '<button class="btn btn-primary btn-sm" data-act="offer-accept" data-id="' + esc(f.id) + '"' + dis + '>Terima ' + rp(canSeller ? f.offeredPrice : f.counterPrice) + '</button></div>' : '') +
    (f.status === 'diterima' && f.orderId ? '<button class="btn btn-ghost btn-sm" style="align-self:flex-start" data-act="open-order" data-id="' + esc(f.orderId) + '">Lihat pesanan' + icon('ArrowRight') + '</button>' : '') +
  '</div>';
}

function priceTable(rows, compact) {
  return '<div class="card table-wrap"><table class="table"><thead><tr><th>Komoditas</th>' + (compact ? '' : '<th>Wilayah</th>') + '<th class="r">Harga</th><th class="r">Perubahan</th></tr></thead><tbody>' +
    rows.map(r => {
      const ch = r[4] ? (r[3] - r[4]) * 100 / r[4] : 0;
      const tone = ch > 0 ? 'bad' : ch < 0 ? 'good' : 'gray';
      return '<tr><td><span aria-hidden="true">' + r[1] + '</span> ' + esc(r[0]) + '</td>' + (compact ? '' : '<td class="muted">' + esc(r[5]) + '</td>') + '<td class="r num strong">' + rp(r[3]) + '/' + esc(r[2]) + '</td><td class="r">' + pill(ch > 0 ? '▲ ' + pct(ch) : ch < 0 ? '▼ ' + pct(ch) : 'Stabil', tone) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}
function viewPrices() {

function setPath(path, value) {
  const parts = path.split('.');
  let o = ui.drafts;
  for (let i = 0; i < parts.length - 1; i++) { if (o[parts[i]] == null || typeof o[parts[i]] !== 'object') o[parts[i]] = {}; o = o[parts[i]]; }
  o[parts[parts.length - 1]] = value;
}
function openSheet(type, id) { ui.sheet = { type, id: id || null }; render(); }
function closeSheet() { ui.sheet = null; ui.errors = {}; render(); }
function closeDialog() { ui.dialog = null; render(); }
function confirmDialog(title, message, confirm, danger, run) { ui.dialog = { type: 'confirm', title, message, confirm, danger: !!danger, run }; render(); }
function goTab(tab) { ui.tab = tab; if (location.hash.slice(1) !== tab) location.hash = tab; else render(); window.scrollTo(0, 0); }
